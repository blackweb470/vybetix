# =========================================================================
# Render Infrastructure as Code (Blueprint Specification)
# Docs: https://render.com/docs/blueprint-spec
# =========================================================================

services:
  # Express Backend API Service (Free Tier)
  - type: web
    name: vybetix-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
