# =========================================================================
# Render Infrastructure as Code (Blueprint Specification)
# Docs: https://render.com/docs/blueprint-spec
# =========================================================================

services:
  # Express Backend API Service
  - type: web
    name: vybetix-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # Next.js Frontend Web Service (Optional — deploy here or on Vercel)
  - type: web
    name: vybetix-web
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
